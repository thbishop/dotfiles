onboarding = false

[keys]
prefix = "ctrl+a"

split_vertical = "prefix+|"

split_horizontal = "prefix+minus"

previous_workspace = "prefix+ctrl+h"
next_workspace = "prefix+ctrl+l"

# New workspaces are handled by the new-workspace-home command below so they
# open in $HOME instead of following the source workspace's cwd.
new_workspace = ""

# we don't use tabs
new_tab = ""

detach = "prefix+d"

close_workspace = "prefix+&"

# we have a custom workspace picker below
workspace_picker = ""

# herdr's workspace-naming does not live-track cwd, so this renames the focused
# workspace to the current directory's basename on demand.
[[keys.command]]
key = "prefix+alt+r"
type = "shell"
command = "~/.config/herdr/scripts/rename-workspace-to-cwd.sh"
description = "rename workspace to cwd basename"

[[keys.command]]
key = "prefix+c"
type = "shell"
command = "herdr workspace create --cwd \"$HOME\" --focus"
description = "new workspace in $HOME"

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = "herdr workspace create --cwd \"$HOME\" --focus"
description = "new workspace in $HOME"

[ui]
# Each workspace holds exactly one tab in this workflow; hide the now-redundant tab bar.
hide_tab_bar_when_single_tab = true

show_agent_labels_on_pane_borders = false

# Compact sidebar
sidebar_collapsed_mode = "compact"

# Share a single divider line between adjacent panes
pane_gaps = false
[advanced]
# herdr caps scrollback in bytes, not lines (~100MB) per pane.
scrollback_limit_bytes = 100000000

[theme]
name = "solarized-light"
auto_switch = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = false
